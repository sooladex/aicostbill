{% extends "base_auth.html" %}
{% block title %}Mot de passe oublie - AICostBill{% endblock %}
{% block content %}
<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
  <h1 class="text-xl font-semibold mb-1">Mot de passe oublie</h1>
  <p class="text-sm text-gray-500 mb-6">
    Indique ton email, on t'envoie un lien pour choisir un nouveau mot de passe.
  </p>
  <form method="post" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input name="email" type="email" required
             class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
             placeholder="toi@agence.com">
    </div>
    <button type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium py-2.5 rounded-lg transition">
      Envoyer le lien
    </button>
  </form>
  <p class="text-sm text-gray-500 mt-6 text-center">
    <a href="{{ url_for('login') }}" class="text-indigo-600 font-medium hover:underline">Retour a la connexion</a>
  </p>
</div>
{% endblock %}
