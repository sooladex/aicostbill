{% extends "base_auth.html" %}
{% block title %}Nouveau mot de passe - AICostBill{% endblock %}
{% block content %}
<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
  <h1 class="text-xl font-semibold mb-1">Choisis un nouveau mot de passe</h1>
  <p class="text-sm text-gray-500 mb-6">Ce lien est valable 1 heure et a usage unique.</p>
  <form method="post" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Nouveau mot de passe</label>
      <input name="password" type="password" required minlength="6"
             class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
             placeholder="6 caracteres minimum">
    </div>
    <button type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium py-2.5 rounded-lg transition">
      Mettre a jour le mot de passe
    </button>
  </form>
</div>
{% endblock %}
