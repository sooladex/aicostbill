{% extends "base_auth.html" %}
{% block title %}Connexion - AICostBill{% endblock %}
{% block content %}
<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
  <h1 class="text-xl font-semibold mb-1">AICostBill</h1>
  <p class="text-sm text-gray-500 mb-6">Connecte-toi a ton espace agence.</p>
  <form method="post" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input name="email" type="email" required
             class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
             placeholder="toi@agence.com">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
      <input name="password" type="password" required
             class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
             placeholder="********">
    </div>
    <button type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium py-2.5 rounded-lg transition">
      Se connecter
    </button>
  </form>
  <p class="text-sm text-gray-500 mt-4 text-center">
    <a href="{{ url_for('forgot_password') }}" class="text-gray-500 hover:text-gray-900 hover:underline">Mot de passe oublie ?</a>
  </p>
  <p class="text-sm text-gray-500 mt-2 text-center">
    Pas encore de compte ?
    <a href="{{ url_for('signup') }}" class="text-indigo-600 font-medium hover:underline">Cree ton agence</a>
  </p>
</div>
{% endblock %}
