<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AICostBill{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
  </style>
</head>
<body class="bg-white text-gray-900 min-h-screen">
  <header class="border-b border-gray-100">
    <div class="max-w-3xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="{{ url_for('landing') }}" class="font-semibold">AICostBill</a>
      <a href="{{ url_for('landing') }}" class="text-sm text-gray-500 hover:text-gray-900">Retour a l'accueil</a>
    </div>
  </header>
  <main class="max-w-3xl mx-auto px-6 py-12">
    {% block content %}{% endblock %}
  </main>
  <footer class="max-w-3xl mx-auto px-6 py-8 border-t border-gray-100 text-xs text-gray-400 flex gap-4">
    <a href="{{ url_for('mentions_legales') }}" class="hover:text-gray-600">Mentions legales</a>
    <a href="{{ url_for('cgu') }}" class="hover:text-gray-600">CGU</a>
    <a href="{{ url_for('confidentialite') }}" class="hover:text-gray-600">Confidentialite</a>
  </footer>
</body>
</html>
